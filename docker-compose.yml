version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: hottime_postgres
    restart: always
    environment:
      POSTGRES_USER: laura
      POSTGRES_PASSWORD: luzhen
      POSTGRES_DB: hottime_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: